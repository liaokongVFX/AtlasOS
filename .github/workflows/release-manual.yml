name: Manual Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to release, for example 0.1.1. A leading v is accepted.'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes. Leave empty to preserve an existing GitHub Release description for this tag.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atlasos-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, tag, and verify release
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      tag_pushed: ${{ steps.tag.outputs.pushed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify branch dispatch
        if: github.ref_type != 'branch'
        shell: pwsh
        run: |
          throw 'Manual releases must be run from a branch so the version commit has a target branch.'

      - name: Verify default branch dispatch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne $env:DEFAULT_BRANCH) {
            throw "Manual releases must run from the default branch '$env:DEFAULT_BRANCH'. Current branch: '$env:TARGET_BRANCH'."
          }

      - name: Normalize release version
        id: release
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $rawVersion = $env:INPUT_VERSION.Trim()
          if ($rawVersion.StartsWith('v')) {
            $version = $rawVersion.Substring(1)
          } else {
            $version = $rawVersion
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use stable SemVer X.Y.Z. Received '$rawVersion'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag is new
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          git fetch --tags --force

          if (git tag --list $tag) {
            throw "Tag $tag already exists locally."
          }

          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($remoteTag) {
            throw "Tag $tag already exists on origin."
          }

      - name: Update package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm.cmd version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "package.json version $packageVersion does not match $env:RELEASE_VERSION."
          }
          Write-Host "package.json version $packageVersion matches release version $env:RELEASE_VERSION."

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm.cmd test

      - name: Build app
        run: npm.cmd run build

      - name: Commit version and create tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package.json package-lock.json
          if (git diff --cached --quiet) {
            Write-Host "Version files already match $env:RELEASE_TAG; no version commit needed."
          } else {
            git commit -m "chore: release $env:RELEASE_TAG"
            git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          }

          git tag -a $env:RELEASE_TAG -m "AtlasOS $env:RELEASE_TAG"
          git push origin $env:RELEASE_TAG
          "pushed=true" >> $env:GITHUB_OUTPUT

  package:
    name: Package ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows NSIS
            platform: windows
            os: windows-2022
            npm: npm.cmd
            artifact-name: atlasos-windows
            artifact-path: |
              release/*.exe
              release/*.blockmap
              release/*.yml
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: ${{ matrix.npm }} run build

      - name: Rebuild native modules
        run: ${{ matrix.npm }} run rebuild

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --publish never
        env:
          npm_config_devdir: .electron-gyp

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          notes_file="$(mktemp)"
          if [ -n "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -s "$notes_file" ]; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            if [ ! -s "$notes_file" ]; then
              echo "release_notes was not provided and GitHub Release $RELEASE_TAG does not exist."
              echo "Create the release with a Description first, or rerun this workflow with release_notes."
              exit 1
            fi

            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "AtlasOS $RELEASE_TAG" --notes-file "$notes_file"
          fi

  cleanup:
    name: Clean up failed release tag
    if: ${{ always() && needs.prepare.outputs.tag_pushed == 'true' && (needs.prepare.result == 'failure' || needs.package.result == 'failure' || needs.publish.result == 'failure') }}
    needs:
      - prepare
      - package
      - publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Delete failed release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release delete "$RELEASE_TAG" --cleanup-tag --yes; then
            git push origin ":refs/tags/$RELEASE_TAG"
          fi
